<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>同词相遇</title><style>
:root{font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif;color:#292640;background:#f8f6ff}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(140deg,#f4edff,#f0fbfd)}main{max-width:520px;margin:auto;padding:30px 18px 60px}header{text-align:center;margin:25px 0 32px}.eyebrow{color:#8064c7;font-weight:700;letter-spacing:2px}h1{font-size:34px;margin:8px 0;background:linear-gradient(90deg,#7450d2,#429bb4);background-clip:text;color:transparent}p{color:#75728b;line-height:1.7}.panel{background:#fff;border-radius:24px;padding:25px 20px;box-shadow:0 12px 35px #8678b21c;margin-bottom:18px}h2{font-size:21px;margin:0 0 15px}input{width:100%;border:2px solid #e8e1f7;border-radius:14px;padding:14px;font:inherit;outline:none;margin:7px 0 13px}input:focus{border-color:#9977e6}button{border:0;border-radius:14px;padding:14px 18px;font:inherit;font-weight:700;cursor:pointer;color:#fff;background:linear-gradient(90deg,#8562dc,#5ba9bc)}button:disabled{opacity:.45;cursor:not-allowed}.secondary{background:#eee8ff;color:#7154ba}.wide{width:100%}.row{display:flex;gap:10px;align-items:center}.row>*{flex:1}.hidden{display:none}.code{font-size:30px;font-weight:800;letter-spacing:6px;color:#7b57d2;text-align:center;padding:12px}.status{border-radius:14px;background:#f5f1ff;padding:12px;color:#745db0;text-align:center}.history{display:flex;flex-direction:column;gap:12px}.round{font-size:12px;color:#aaa}.pair{display:grid;grid-template-columns:1fr 24px 1fr;gap:8px;align-items:center}.word{border-radius:12px;padding:14px 7px;text-align:center;font-weight:700;overflow-wrap:anywhere;background:#eee8ff;color:#7954ce}.word.other{background:#e5f7f9;color:#398e9e}.vs{text-align:center;color:#aaa}.win{font-size:27px;text-align:center;color:#7954ce;font-weight:800}.small{font-size:13px}#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);padding:12px 18px;background:#2c2740;color:#fff;border-radius:12px;display:none;max-width:90vw}footer{text-align:center;font-size:12px;color:#aaa;margin-top:28px}</style></head><body><main><header><div class="eyebrow">词不一样？加练一轮！</div><h1>微热同词相遇</h1><p>两个人各想一个词，同时揭晓。<br>没撞上，就从这些词继续联想。</p></header>
<section id="start" class="panel"><h2>开启你们的默契挑战</h2><button class="wide" id="create">创建双人房间</button><p style="text-align:center">或者输入朋友发来的房间号</p><input id="codeInput" placeholder="6 位房间号" maxlength="6" autocomplete="off"><button class="wide secondary" id="join">加入房间</button></section>
<section id="game" class="hidden"><div class="panel"><h2>你们的专属房间</h2><div class="code" id="code"></div><button class="wide secondary" id="share">复制邀请链接</button><p id="connection" class="status">等待朋友加入…</p></div><div class="panel"><h2 id="roundTitle">第 1 轮</h2><p>想一个词，不要告诉对方。双方提交后才会揭晓。</p><input id="wordInput" maxlength="40" placeholder="输入你想到的词"><button id="submit" class="wide">提交我的词语</button><p id="submitState" class="small"></p></div><div id="result" class="panel hidden"></div><div class="panel"><h2>联想记录</h2><div class="history" id="history"><p>第一轮还没开始～</p></div></div><div class="panel hidden" id="winPanel"><div class="win">✨ 你们想到一起啦！ ✨</div><p style="text-align:center">恭喜完成同词挑战</p><button class="wide" id="restart">再来一局</button></div></section><footer>用同一个房间链接，在两台手机上一起玩</footer></main><div id="toast"></div><script>
const $=id=>document.getElementById(id);let socket,index=-1,roomCode='',latest=null,finished=false;function toast(s){$('toast').textContent=s;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',3000)}function send(o){if(socket?.readyState===1)socket.send(JSON.stringify(o))}function connect(callback){const protocol=location.protocol==='https:'?'wss':'ws';socket=new WebSocket(protocol+'://'+location.host);socket.onopen=callback;socket.onerror=()=>toast('连接失败，请刷新重试');socket.onclose=()=>{toast('连接已断开，请刷新页面');$('submit').disabled=true};socket.onmessage=e=>{const m=JSON.parse(e.data);if(m.type==='error')toast(m.message);if(m.type==='joined'){index=m.index;roomCode=m.code;$('start').classList.add('hidden');$('game').classList.remove('hidden');$('code').textContent=roomCode;history.replaceState({},'', '?room='+roomCode)}if(m.type==='state'){finished=m.finished;$('connection').textContent=m.players===2?'双方已连接，可以开始！':'等待第二位玩家加入…';$('roundTitle').textContent='第 '+m.round+' 轮';const submitted=!!m.submitted[index];$('submit').disabled=m.players!==2||submitted||finished;$('wordInput').disabled=submitted||finished;$('submitState').textContent=finished?'本局完成！':submitted?'已提交，等待对方…':m.submitted.some(Boolean)?'对方已提交，轮到你啦':'双方准备就绪';if(latest&&latest.round<m.round&&!finished){$('wordInput').value='';$('wordInput').disabled=false}renderHistory(m.history);$('winPanel').classList.toggle('hidden',!finished)}if(m.type==='reveal'){latest=m.result;const r=m.result;$('result').classList.remove('hidden');$('result').innerHTML='<h2>第 '+r.round+' 轮揭晓</h2><div class="pair"><div class="word"></div><div class="vs">×</div><div class="word other"></div></div><p style="text-align:center">'+(r.matched?'🎉 你们想到了同一个词！':'还没相遇，从这两个词继续联想吧！')+'</p>';$('result').querySelector('.word').textContent=r.words[index];$('result').querySelector('.other').textContent=r.words[1-index];$('wordInput').value=''}if(m.type==='restart'){$('result').classList.add('hidden');$('wordInput').value='';latest=null}if(m.type==='closed'){toast(m.message);$('submit').disabled=true;$('connection').textContent='房间已关闭，请刷新重新创建'}}}
function renderHistory(items){const root=$('history');root.replaceChildren();if(!items.length){const p=document.createElement('p');p.textContent='第一轮还没开始～';root.append(p);return}items.forEach(r=>{const d=document.createElement('div');const t=document.createElement('div');t.className='round';t.textContent='第 '+r.round+' 轮'+(r.matched?' · 默契成功！':'');const pair=document.createElement('div');pair.className='pair';const a=document.createElement('div');a.className='word';a.textContent=r.words[index];const x=document.createElement('div');x.className='vs';x.textContent=r.matched?'♥':'×';const b=document.createElement('div');b.className='word other';b.textContent=r.words[1-index];pair.append(a,x,b);d.append(t,pair);root.append(d)})}
$('create').onclick=()=>connect(()=>send({type:'create'}));$('join').onclick=()=>{const code=$('codeInput').value.trim().toUpperCase();if(!/^[A-Z0-9]{6}$/.test(code))return toast('请输入 6 位房间号');connect(()=>send({type:'join',code}))};$('submit').onclick=()=>{const word=$('wordInput').value.trim();if(!word)return toast('先输入一个词吧');send({type:'submit',word})};$('wordInput').addEventListener('keydown',e=>{if(e.key==='Enter')$('submit').click()});$('restart').onclick=()=>send({type:'restart'});$('share').onclick=async()=>{const link=location.origin+'/?room='+roomCode;try{await navigator.clipboard.writeText(link);toast('邀请链接已复制')}catch{prompt('复制邀请链接',link)}};const invite=new URLSearchParams(location.search).get('room');if(invite){$('codeInput').value=invite.toUpperCase();connect(()=>send({type:'join',code:invite}))}
</script></body></html>
